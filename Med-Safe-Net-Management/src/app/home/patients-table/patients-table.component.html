<table *ngIf=" patients.length" class="patient-table">
  <thead>
    <tr>
      <th>Username</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>User Code</th>
      <th>Date of Birth</th>
    </tr>
  </thead>
  <tbody>
    <tr
      *ngFor="let patient of patients"
      (click)="onSelectPatient(patient)"
      class="clickable-row"
    >
      <td>{{ patient.username }}</td>
      <td>{{ patient.firstName }}</td>
      <td>{{ patient.lastName }}</td>
      <td>{{ patient.email }}</td>
      <td>{{ patient.userCode }}</td>
      <td>{{ patient.dateOfBirth | date: 'mediumDate' }}</td>
    </tr>
  </tbody>
</table>

<div *ngIf="!patients.length">No patients found.</div>
